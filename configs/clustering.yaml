# ---------------------------------------------------------------------------
# Clustering configuration
# ---------------------------------------------------------------------------
# Benchmark algorithms (fixed by research methodology):
#   1. K-Means
#   2. K-Medoids
#   3. Agglomerative Clustering
#   4. DBSCAN
#
# This file only defines the algorithmic search space. Final hyperparameters
# will be set after the dataset audit and feature inspection stages.
# ---------------------------------------------------------------------------

clustering:
  random_seed: 42
  n_jobs: -1

  # Feature preprocessing for clustering
  preprocessing:
    skewness_correction: "TODO"      # none | log1p | yeojohnson
    scaler: "TODO"                  # standard | robust | minmax | none

  # Algorithms to benchmark
  algorithms:

    kmeans:
      enabled: true
      k_range: [2, 10]
      n_init: 10
      max_iter: 300

    kmedoids:
      enabled: true
      k_range: [2, 10]
      metric: "TODO"                # euclidean | precomputed
      init: "TODO"                  # random | k-medoids++ | heuristic

    agglomerative:
      enabled: true
      k_range: [2, 10]
      linkage: "TODO"               # ward | complete | average | single
      metric: "TODO"                # euclidean | precomputed

    dbscan:
      enabled: true
      eps_range: "TODO"             # e.g. [0.1, 0.5, 1.0, 2.0]
      min_samples_range: "TODO"     # e.g. [5, 10, 20]

  # Output
  output:
    labels_path: "./data/processed/cluster_labels.parquet"
    models_path: "./data/processed/cluster_models/"