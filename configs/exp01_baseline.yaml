# ---------------------------------------------------------------------------
# EXP-01 Baseline Configuration
# ---------------------------------------------------------------------------
#
# Single source of truth for the EXP-01 baseline experiment.
# Not used by EPIC-06 or other experiments.
#
# Design rationale:
# - Separate from configs/clustering.yaml (which holds EPIC-06 working defaults)
#   and configs/experiment.yaml (which holds generic pipeline config).
# - This file can be modified for EXP-01 without affecting other stages.
#
# EXP-01 scope:
#   - Run 5 clustering algorithms on the FE-06 final clustering dataset
#     using working defaults from configs/clustering.yaml.
#   - Compute unified evaluation metrics (silhouette, DBI, CH, WCSS).
#   - Measure algorithm execution runtime with repetition-based statistics.
#   - Record all metrics with applicability status.
#
# EXP-01 does NOT:
#   - Sweep hyperparameters (EPIC-07 scope).
#   - Rank / compare algorithms (EPIC-08 scope).
#   - Perform stability analysis (EXP-05 / EPIC-08 scope).
#   - Profile customer segments (EPIC-09 scope).
#
# Working defaults
# ---------------------------------------------------------------------------
# All algorithm parameters are WORKING_ASSUMPTIONS, not final approved.
# They are sourced from configs/clustering.yaml algorithms.*.working_* fields.
# EPIC-07 will sweep these parameters with a controlled matrix.
# ---------------------------------------------------------------------------

exp01:
  name: "EXP-01 Baseline"
  description: >
    Unified baseline experiment for 5 clustering algorithms.
    Serves as the reference point for EPIC-07 sweep and EPIC-08 comparison.
    Metrics are computed and recorded; they are NOT used to rank algorithms.

  # Canonical algorithm order (used in reports)
  # Order: kmeans, agglomerative, dbscan, gmm, fuzzy_cmeans
  # Must match CANONICAL_ALGORITHMS in src/customer_segmentation/clustering/baseline.py
  algorithms:
    - kmeans
    - agglomerative
    - dbscan
    - gmm
    - fuzzy_cmeans

  # Baseline seed — SAME seed across all repetitions (seed=42).
  # EXP-01 repetition uses the same seed to measure runtime variance
  # and verify determinism. It is NOT stability analysis.
  # EXP-05 generates evidence across multiple seeds.
  baseline_seed: 42

  # Runtime repetition count.
  # Each (algorithm, hyperparameters) is run n_repeat times with
  # the same baseline_seed to collect runtime statistics.
  # PENDING_REVIEW: n_repeat=5 is a reasonable starting point.
  runtime:
    repeat: 5

  # Evaluation configuration
  evaluation:
    # Internal clustering metrics computed for every algorithm
    internal_metrics:
      - silhouette
      - davies_bouldin
      - calinski_harabasz
      - wcss

    # Stability evidence (cluster labels) is generated by EXP-05.
    # EXP-01 does NOT compute ARI/AMI.
    stability:
      enabled: false

  # DBSCAN noise handling
  dbscan:
    # Exclude noise-labelled points from internal metrics and WCSS.
    # Noise (label -1) is not treated as a cluster.
    exclude_noise_from_metrics: true
    # sklearn convention for noise label. DO NOT change without ADR.
    noise_label: -1

  # WCSS convention
  wcss:
    # WCSS = Σ_i ‖x_i - μ_c‖²
    # μ_c is the arithmetic centroid of hard cluster c.
    # For GMM: hard labels = argmax(posterior probabilities).
    # For FCM: hard labels = argmax(membership matrix).
    # GMM Gaussian means and FCM fuzzy centroids are NOT used for WCSS.
    exclude_noise: true
    centroid_method: "arithmetic_hard_labels"

  # Metric applicability policy
  # All three internal metrics share the same applicability rules.
  metric_applicability:
    # Rule: how to handle a case where the metric cannot be computed
    on_not_applicable:
      # status value written to metrics.extra.{metric}_status
      status: "NOT_APPLICABLE"
      # reason value written to metrics.extra.{metric}_reason
      reason_source: "edge_case"
    # Edge cases
    edge_cases:
      ALL_NOISE:
        reason: "ALL_NOISE"
        description: "All samples labelled as noise (DBSCAN all-noise case)"
      SINGLE_CLUSTER:
        reason: "SINGLE_CLUSTER"
        description: "Only one cluster found (silhouette / DBI / CH undefined for k=1)"
      INSUFFICIENT_CLUSTERS:
        reason: "INSUFFICIENT_CLUSTERS"
        description: "Fewer than 2 clusters (metrics require k>=2)"
      COMPUTATION_ERROR:
        reason: "COMPUTATION_ERROR"
        description: "sklearn raised an exception during computation"

# Working defaults per algorithm
# Sourced from configs/clustering.yaml algorithms.*.working_* fields.
# These are WORKING_ASSUMPTIONS — not final approved methodology.
# ---------------------------------------------------------------------------

working_defaults:

  kmeans:
    n_clusters: 4
    init: "k-means++"
    n_init: 10
    max_iter: 300
    tol: 1.0e-4

  agglomerative:
    n_clusters: 4
    linkage: "ward"
    metric: "euclidean"
    compute_distances: true

  dbscan:
    eps: 0.5
    min_samples: 5
    metric: "euclidean"

  gmm:
    n_components: 4
    covariance_type: "full"
    init_params: "kmeans"
    tol: 1.0e-3
    reg_covar: 1.0e-6
    max_iter: 100
    n_init: 1

  fuzzy_cmeans:
    n_clusters: 4
    m: 2.0
    max_iter: 300
    error: 1.0e-4
