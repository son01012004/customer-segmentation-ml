[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-segmentation-ml"
version = "0.1.0"
description = "Customer segmentation using unsupervised machine learning on UCI Online Retail data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Customer Segmentation ML Research Team" },
]
keywords = [
    "customer-segmentation",
    "clustering",
    "rfm",
    "machine-learning",
    "unsupervised-learning",
    "retail-analytics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are kept in sync with requirements.txt
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.4,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "openpyxl>=3.1,<4.0",
    "pyarrow>=15.0,<18.0",
    "PyYAML>=6.0,<7.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
]

[project.urls]
Repository = "https://github.com/<org>/customer-segmentation-ml"
Issues = "https://github.com/<org>/customer-segmentation-ml/issues"

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# Ruff configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", "build", "dist", ".pytest_cache", "configs"]

[tool.ruff.lint]
# Sensible default rule selection; teams can tighten later.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function calls in defaults are intentional for config objects
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]  # tests may use sklearn/X API casing
"src/customer_segmentation/clustering/*" = ["N803", "N806"]  # X is the conventional ML feature-matrix name (used by ML-01 runner)
"src/customer_segmentation/evaluation/*" = ["N803"]  # X is the conventional ML feature-matrix name
"src/customer_segmentation/transformation/*" = ["N803"]  # X is the conventional ML feature-matrix name
"src/customer_segmentation/visualization/*" = ["N803"]  # X is the conventional ML feature-matrix name
"notebooks/*" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Black configuration
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  | build
  | dist
  | \.pytest_cache
)/
'''